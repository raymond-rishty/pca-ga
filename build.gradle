def pagefindState = new File(stageDir, 'pagefind-output.json')
def renderInterrupted = file('.gradle/build-state/render-in-progress')
def sha256File = { File target ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    target.withInputStream { stream ->
        byte[] buffer = new byte[1024 * 1024]
        int count
        while ((count = stream.read(buffer)) > 0) { digest.update(buffer, 0, count) }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}
def linkedHtmlMatches = {
    if (!linkState.isFile() || !htmlSignatureState.isFile()
        || !new File(siteDir, 'index.html').isFile()) return false
    try {
        def expected = new groovy.json.JsonSlurper().parse(htmlSignatureState)
        def actual = fileTree(siteDir).matching { include '**/*.html' }.files
        if (expected == null || expected.keySet().size() != actual.size()) return false
        actual.every { page ->
            def relative = siteDir.toPath().relativize(page.toPath()).toString().replace('\\', '/')
            def signature = expected[relative]
            signature instanceof Map &&
                signature['size'] == page.length() &&
                Math.floorDiv(signature['mtime_ns'] as long, 1000000L) == page.lastModified()
        }
    } catch (Exception ignored) {
        false
    }
}
def pagefindFilesMatch = {
    if (!pagefindState.isFile()) return false
    try {
        def expected = new groovy.json.JsonSlurper().parse(pagefindState)
        def directory = new File(siteDir, 'pagefind')
        def actual = fileTree(directory).files
        if (expected.keySet().size() != actual.size()) return false
        actual.every { asset ->
            def relative = directory.toPath().relativize(asset.toPath()).toString().replace('\\', '/')
            def signature = expected[relative]
            signature instanceof Map &&
                signature['size'] == asset.length() &&
                Math.floorDiv(signature['mtime_ns'] as long, 1000000L) == asset.lastModified()
        }
    } catch (Exception ignored) {
        false
    }
}
