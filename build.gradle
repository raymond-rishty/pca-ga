    [siteSources, fileTree('scripts') { include 'render_site.py', 'run_site_stage.py', 'linker_fingerprint.py' },
     file('Gemfile'), file('Gemfile.lock'), structuralMarker],
    [jekyllChanges, jekyllGeneration]
)
renderJekyll.configure {
    // Jekyll reads the generated catalogues and Markdown pages produced by the
    // data graph. Keep that graph explicit so Gradle 9 can order producers
    // before the source-tree scan without folding generation into this task.
    dependsOn 'prepareJekyllStructure', 'checkBundleDependencies', 'prepareData'
    inputs.property('siteDirectory', siteDir.absolutePath)
    inputs.property('pythonVersion', pythonVersion)
    inputs.property('rubyVersion', providers.gradleProperty('rubyVersion').orElse('unspecified'))
    outputs.upToDateWhen { !renderInterrupted.exists() && linkedHtmlMatches() }
}

