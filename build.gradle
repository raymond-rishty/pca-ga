def commandLineFor = { List<String> command ->
    if (isWindows && ['bundle', 'npx'].contains(command[0].toLowerCase(Locale.ROOT))) {
        return ['cmd.exe', '/d', '/c'] + command
    }
    return command
}

def registerCommand = { String taskName, List<String> command, Collection inputFiles = [],
                        Collection outputFiles = [], boolean cacheable = false ->
    tasks.register(taskName, Exec) {
        group = 'site build'
        workingDir = projectDir
        commandLine commandLineFor(command)
        environment 'PYTHONUTF8', '1'

        inputFiles.eachWithIndex { inputFileSet, index ->
            inputs.files(inputFileSet)
                .withPropertyName("sourceFiles${index}")
                .withPathSensitivity(PathSensitivity.RELATIVE)
                .normalizeLineEndings()
        }
        inputs.property('commandLine', command)
        inputs.property('pythonVersion', pythonVersion)
        inputs.property('hostPlatform', "${System.getProperty('os.name')}-${System.getProperty('os.arch')}")

        if (!outputFiles.isEmpty()) {
            outputFiles.eachWithIndex { output, index ->
                if (output instanceof File && output.isDirectory()) {
                    outputs.dir(output).withPropertyName("generatedDirectory${index}")
                } else {
                    outputs.files(project.files(output)).withPropertyName("generatedFiles${index}")
                }
            }
            if (cacheable) {
                outputs.cacheIf('deterministic generated data') { true }
            }
        }
    }
}

