def structuralInputs = files(
    file('_config.yml'), file('Gemfile'), file('Gemfile.lock'), fileTree('_layouts'),
    fileTree('_includes'), fileTree('_sass'), fileTree('_plugins'), fileTree('_data'), fileTree('assets')
)
def structuralMarker = file('.gradle/build-state/jekyll-structure.marker')
def structuralFingerprint = {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    structuralInputs.files.findAll { it.isFile() }
        .sort { left, right -> left.absolutePath <=> right.absolutePath }
        .each { source ->
            def relative = projectDir.toPath().relativize(source.toPath()).toString().replace('\\', '/')
            digest.update(relative.getBytes('UTF-8'))
            digest.update((byte) 0)
            source.withInputStream { stream ->
                byte[] buffer = new byte[1024 * 1024]
                int count
                while ((count = stream.read(buffer)) > 0) {
                    digest.update(buffer, 0, count)
                }
            }
            digest.update((byte) 0)
        }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}
tasks.register('prepareJekyllStructure') {
    group = 'site build'
    description = 'Forces a full Jekyll regeneration when its structural inputs change.'
    inputs.files(structuralInputs)
        .withPropertyName('jekyllStructure')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    outputs.file(structuralMarker)
    doLast {
        def metadata = file('.jekyll-metadata')
        def currentFingerprint = structuralFingerprint()
        def previousFingerprint = structuralMarker.exists() ? structuralMarker.text.trim() : ''
        if (metadata.exists() && previousFingerprint != currentFingerprint) {
            metadata.delete()
        }
        structuralMarker.parentFile.mkdirs()
        structuralMarker.text = currentFingerprint + '\n'
    }
}

def renderSite = tasks.register('renderSite', Exec) {
    group = 'site build'
    description = 'Render, link, generate provision pages, and index the static site.'
    dependsOn 'prepareJekyllStructure', validateFootnotes

    def siteInputs = fileTree(projectDir) {
        exclude '.git/**', '.gradle/**', 'build/**', '_site/**', '.jekyll-cache/**',
            '.sass-cache/**', '.jekyll-metadata', 'node_modules/**', '_constitution/**',
            '.claude/**', '.github/**', 'scripts/**', 'tests/**', 'cases-rebuilt/**',
            'evals/**', 'ocr-bakeoff/**', 'outputs/**', 'tmp/**', 'vendor/**',
            '**/*.jsonl', 'index/*.json', 'index/rpr/**', 'index/segments/**',
            'index/hunt/**', 'index/sjc_official/**', 'index/digest/**',
            'index/structure/**', 'index/synopsis_workflow/**',
            'Gemfile', 'Gemfile.lock', 'build.gradle', 'settings.gradle',
            'gradle.properties', 'gradlew', 'gradlew.bat', 'gradle/**'
        def projectPath = projectDir.toPath().toAbsolutePath()
        def outputPath = siteDir.toPath().toAbsolutePath()
        if (projectPath.root == outputPath.root) {
            def relativeOutput = projectPath.relativize(outputPath).toString().replace('\\', '/')
            if (!relativeOutput.startsWith('..') && relativeOutput != '.') {
                exclude "${relativeOutput}/**"
            }
        }
    }
    inputs.files(siteInputs)
        .withPropertyName('siteSources')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    inputs.files(fileTree(constitutionContent))
        .withPropertyName('constitutionSources')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    inputs.files(fileTree('scripts') { exclude 'validate_site_build.py' })
        .withPropertyName('renderScripts')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    inputs.files(file('Gemfile'), file('Gemfile.lock'))
        .withPropertyName('jekyllDependencies')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    inputs.file('scripts/render_site.py')
    inputs.property('siteDirectory', siteDir.absolutePath)
    inputs.property('constitutionDirectory', constitutionContent.absolutePath)
    inputs.property('incrementalJekyll', incrementalJekyll)
    inputs.property('pythonVersion', pythonVersion)
    inputs.property('rubyVersion', providers.gradleProperty('rubyVersion').orElse('unspecified'))
    inputs.property('nodeVersion', providers.gradleProperty('nodeVersion').orElse('unspecified'))
    outputs.dir(siteDir)

    def args = [pythonCommand, 'scripts/render_site.py', '--root', projectDir.absolutePath,
                '--site', siteDir.absolutePath, '--reader', constitutionContent.absolutePath]
    if (incrementalJekyll) {
        args += '--incremental-jekyll'
    }
    workingDir projectDir
    commandLine args
    environment 'PYTHONUTF8', '1'
}

def refreshFastPreviewSearch = providers.gradleProperty('refreshPreviewSearch')
    .map { it.toBoolean() }.orElse(false).get()
def fastPreview = tasks.register('fastPreview', Exec) {
    group = 'site build'
    description = 'Incrementally render changed pages for a local preview.'
    dependsOn 'prepareJekyllStructure', 'checkBundleDependencies', 'preparePreviewData'

    def fastSiteInputs = fileTree(projectDir) {
        exclude '.git/**', '.gradle/**', 'build/**', '_site/**', '.jekyll-cache/**',
            '.sass-cache/**', '.jekyll-metadata', 'node_modules/**', '_constitution/**',
            '.claude/**', '.github/**', 'scripts/**', 'tests/**', 'cases-rebuilt/**',
            'evals/**', 'ocr-bakeoff/**', 'outputs/**', 'tmp/**', 'vendor/**',
            '**/*.jsonl', 'index/*.json', 'index/rpr/**', 'index/segments/**',
            'index/hunt/**', 'index/sjc_official/**', 'index/digest/**',
            'index/structure/**', 'index/synopsis_workflow/**',
            'Gemfile', 'Gemfile.lock', 'build.gradle', 'settings.gradle',
            'gradle.properties', 'gradlew', 'gradlew.bat', 'gradle/**'
        def projectPath = projectDir.toPath().toAbsolutePath()
        def outputPath = siteDir.toPath().toAbsolutePath()
        if (projectPath.root == outputPath.root) {
            def relativeOutput = projectPath.relativize(outputPath).toString().replace('\\', '/')
            if (!relativeOutput.startsWith('..') && relativeOutput != '.') {
                exclude "${relativeOutput}/**"
            }
        }
    }
    inputs.files(fastSiteInputs)
        .withPropertyName('fastSiteSources')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    inputs.files(fileTree(constitutionContent))
        .withPropertyName('fastConstitutionSources')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    inputs.file('index/provision_catalogue.json')
        .withPropertyName('fastProvisionCatalogue')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    inputs.files(fileTree('scripts'))
        .withPropertyName('fastRenderScripts')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    inputs.files(
        file('index/authority_index.json'), file('index/case_provision_index.json'),
        file('index/source_registry.json'), file('index/dedicated_pdf_inventory.json'),
        file('app/search_index.json'), file('app/provision_search.json'),
        file('index/CASES-BY-PROVISION.md'), file('index/AUTHORITY-BY-PROVISION.md'),
        fileTree('api/bco'), fileTree('api/provisions'), file('llms-full.txt')
    ).withPropertyName('fastGeneratedData')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    inputs.files(file('Gemfile'), file('Gemfile.lock'))
        .withPropertyName('fastJekyllDependencies')
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .normalizeLineEndings()
    inputs.property('fastSiteDirectory', siteDir.absolutePath)
    inputs.property('refreshPreviewSearch', refreshFastPreviewSearch)
    outputs.dir(siteDir)

    def args = [pythonCommand, 'scripts/render_site.py', '--fast-preview',
                '--root', projectDir.absolutePath, '--site', siteDir.absolutePath,
                '--reader', constitutionContent.absolutePath]
    if (refreshFastPreviewSearch) {
        args += '--refresh-search'
    }
    workingDir projectDir
    commandLine args
    environment 'PYTHONUTF8', '1'
}

