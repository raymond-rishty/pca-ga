[project]
name = "pca-ocr-bakeoff"
version = "0.1.0"
description = "Reproducible OCR bakeoff for the 11th PCA General Assembly minutes"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "pillow>=10",
  "psutil>=5.9",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "rapidfuzz>=3.9",
  "markdown-it-py>=4.0",
  "huggingface-hub>=0.30",
  "transformers>=4.52,<5",
  "accelerate>=0.34",
  "timm>=1.0",
  "einops>=0.8",
  "open-clip-torch>=2.24",
]

[tool.uv]
package = false
