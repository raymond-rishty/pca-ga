<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCA Judicial Synopsis Review</title>
  <style>
    :root { color-scheme: light; --ink:#22251f; --muted:#6e7168; --paper:#f7f4ec;
      --panel:#fffdf7; --line:#d8d2c4; --accent:#345c45; --gold:#a06b24;
      --reject:#99473f; --repair:#76528d; --shadow:0 10px 35px #29271f18; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 system-ui,sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    header { height:66px; padding:10px 18px; display:flex; align-items:center; gap:18px;
      border-bottom:1px solid var(--line); background:#fffaf0; position:sticky; top:0; z-index:4; }
    h1 { font:600 21px/1.1 Georgia,serif; margin:0; white-space:nowrap; }
    .progress { flex:1; max-width:520px; }
    .progress-bar { height:7px; background:#e5dfd2; border-radius:9px; overflow:hidden; }
    .progress-bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
    .progress-text { color:var(--muted); font-size:12px; margin-top:3px; }
    .reviewer { margin-left:auto; display:flex; align-items:center; gap:7px; color:var(--muted); }
    .reviewer input { width:150px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:white; }
    .offline-button { border:1px solid var(--line); border-radius:6px; padding:7px 10px; background:white; }
    main { display:grid; grid-template-columns:285px minmax(360px,1fr) minmax(390px,1fr); height:calc(100vh - 66px); }
    aside,.source,.review { min-height:0; }
    aside { border-right:1px solid var(--line); display:flex; flex-direction:column; background:#f2eee4; }
    .filters { padding:12px; border-bottom:1px solid var(--line); display:grid; gap:8px; }
    .filters input,.filters select { width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:6px; background:white; }
    #caseList { overflow:auto; padding:7px; }
    .case-item { width:100%; border:0; border-left:4px solid transparent; background:transparent;
      text-align:left; padding:9px 9px 9px 10px; border-radius:5px; color:var(--ink); }
    .case-item:hover { background:#e9e3d7; }
    .case-item.active { background:white; border-left-color:var(--accent); box-shadow:0 2px 9px #0000000d; }
    .case-item .id { font-weight:700; font-variant-numeric:tabular-nums; }
    .case-item .title { display:block; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; }
    .case-item .priority { display:block; color:#76528d; font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
    .case-item.unreviewed { border-left-color:#c6c0b4; }
    .case-item.unreviewed .id::after { content:' · unreviewed'; color:var(--muted); font-size:10px; font-weight:500; }
    .case-item.approved .id { color:var(--accent); }
    .case-item.corrected .id { color:var(--gold); }
    .case-item.rejected .id { color:var(--reject); }
    .case-item.source_repair .id { color:var(--repair); }
    .source { display:flex; flex-direction:column; border-right:1px solid var(--line); background:#fcfaf4; }
    .pane-head { padding:12px 16px; border-bottom:1px solid var(--line); background:#f7f3e9; }
    .pane-head strong { display:block; }
    .pane-head small { color:var(--muted); }
    #sourceText { margin:0; padding:18px 22px 80px; overflow:auto; white-space:pre-wrap;
      font:14px/1.58 ui-monospace,SFMono-Regular,Consolas,monospace; flex:1; }
    .review { overflow:auto; padding:18px 20px 95px; }
    .case-title { font:600 25px/1.2 Georgia,serif; margin:0 0 6px; }
    .eyebrow { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:700; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 18px; }
    .chip { padding:4px 8px; border-radius:14px; background:#e8eee9; color:#2c503b; font-size:12px; }
    .chip.status { font-weight:700; border:1px solid transparent; }
    .chip.unreviewed { background:#ebe7de; color:#66635c; border-color:#d6d0c4; }
    .chip.approved { background:#dcece0; color:#24523a; border-color:#b9d5c0; }
    .chip.corrected { background:#f2e6d2; color:#76501b; border-color:#ddc49d; }
    .chip.rejected { background:#f3dfdc; color:#873c35; border-color:#deb7b2; }
    .chip.source_repair { background:#eadff0; color:#66427d; border-color:#cdb8d8; }
    .chip.identity { background:#e7e2f0; color:#624b78; border:1px solid #cfc3dc; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:14px 15px; margin:0 0 13px; box-shadow:var(--shadow); }
    .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:0 0 8px; }
    .summary { font:17px/1.55 Georgia,serif; margin:0; }
    .current { color:#5d5d57; }
    .compare { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .metadata { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
    .metadata dt { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
    .metadata dd { margin:2px 0 8px; }
    textarea { width:100%; min-height:170px; resize:vertical; padding:10px; border:1px solid var(--line); border-radius:6px; background:white; }
    .edit-grid { display:grid; gap:9px; }
    .edit-grid label { color:var(--muted); font-size:12px; }
    .edit-grid select,.edit-grid input { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:white; }
    .actions { position:fixed; left:calc(285px + (100vw - 285px)/2); right:0; bottom:0; padding:12px 20px;
      border-top:1px solid var(--line); background:#fffaf0eb; backdrop-filter:blur(10px); display:flex; gap:8px; z-index:3; }
    .actions button { border:1px solid var(--line); border-radius:7px; padding:9px 12px; background:white; }
    .actions .approve { color:var(--accent); }
    .actions .reject { color:var(--reject); }
    .actions .repair { color:var(--repair); }
    .actions button.selected { font-weight:700; box-shadow:inset 0 0 0 2px #aaa398; }
    .actions .approve.selected { background:var(--accent); color:white; border-color:var(--accent); box-shadow:none; }
    .actions #correct.selected { background:var(--gold); color:white; border-color:var(--gold); box-shadow:none; }
    .actions .reject.selected { background:var(--reject); color:white; border-color:var(--reject); box-shadow:none; }
    .actions .repair.selected { background:var(--repair); color:white; border-color:var(--repair); box-shadow:none; }
    .actions #undo.selected { background:#67645d; color:white; border-color:#67645d; box-shadow:none; }
    kbd { border:1px solid #c7c0b2; border-bottom-width:2px; border-radius:4px; padding:1px 5px; font-size:11px; background:white; color:#57574f; }
    #toast { position:fixed; right:18px; top:76px; background:#252820; color:white; padding:9px 13px; border-radius:7px;
      opacity:0; transform:translateY(-8px); transition:.18s; pointer-events:none; z-index:10; }
    #toast.show { opacity:1; transform:none; }
    .hidden { display:none !important; }
    .empty { color:var(--muted); padding:20px; }
    @media (max-width:1050px) { main { grid-template-columns:240px 1fr; } .source { display:none; }
      .actions { left:240px; } }
  </style>
</head>
<body>
  <header>
    <h1>Judicial synopsis review</h1>
    <div class="progress"><div class="progress-bar"><i id="progressBar"></i></div><div class="progress-text" id="progressText">Loading…</div></div>
    <label class="reviewer">Reviewer <input id="reviewer" placeholder="Your name or initials" autocomplete="name"></label>
    <button class="offline-button hidden" id="exportOffline">Export decisions</button>
  </header>
  <main>
    <aside>
      <div class="filters">
        <input id="search" type="search" placeholder="Find case or title">
        <select id="statusFilter"><option value="all">All decisions</option><option value="unreviewed">Unreviewed</option><option value="approved">Approved</option><option value="corrected">Corrected</option><option value="rejected">Rejected</option><option value="source_repair">Source repair</option></select>
        <select id="providerFilter"><option value="all">All providers</option><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option></select>
        <select id="priorityFilter"><option value="queue" selected>Review queue + completed</option><option value="reviewed">Reviewed cases</option><option value="must_review">Must review</option><option value="high_priority">High priority</option><option value="statistical_sample">Statistical sample</option><option value="remaining">Remaining cases</option><option value="all">All priorities</option></select>
      </div>
      <div id="caseList"></div>
    </aside>
    <section class="source">
      <div class="pane-head"><strong>Case text</strong><small id="sourcePath">—</small></div>
      <pre id="sourceText">Select a case.</pre>
    </section>
    <section class="review">
      <div class="eyebrow" id="caseId">—</div>
      <h2 class="case-title" id="caseTitle">Select a case</h2>
      <div class="chips" id="chips"></div>
      <div class="compare">
        <div class="card"><h2>Existing synopsis</h2><p class="summary current" id="currentSummary">—</p></div>
        <div class="card"><h2>Candidate synopsis</h2><p class="summary" id="candidateSummary">—</p></div>
      </div>
      <div class="card"><h2>Metadata comparison</h2><dl class="metadata" id="metadata"></dl></div>
      <div class="card"><h2>Candidate evidence and limitations</h2><div id="evidence">—</div></div>
      <div class="card"><h2>Audit note</h2><textarea id="notes" placeholder="Required detail for rejection or source repair; optional for approval"></textarea></div>
      <div class="card hidden" id="editor"><h2>Correct candidate</h2><div class="edit-grid">
        <label>Synopsis<textarea id="editSummary"></textarea></label>
        <label>Matter type<select id="editMatter"></select></label>
        <label>Final dispositions (comma-separated enum values)<input id="editDispositions"></label>
        <button id="saveCorrection">Save corrected result <kbd>Ctrl</kbd>+<kbd>Enter</kbd></button>
      </div></div>
    </section>
  </main>
  <div class="actions">
    <button class="approve" id="approve">Approve <kbd>A</kbd></button>
    <button id="correct">Correct <kbd>C</kbd></button>
    <button class="reject" id="reject">Reject <kbd>R</kbd></button>
    <button class="repair" id="repair">Source repair <kbd>X</kbd></button>
    <button id="undo">Unreviewed <kbd>U</kbd></button>
    <button id="previous">Previous <kbd>K</kbd></button>
    <button id="next">Next <kbd>J</kbd></button>
  </div>
  <div id="toast"></div>
  <!-- OFFLINE_DATA -->
  <script>
    const matterTypes = ['complaint','appeal','judicial_reference','original_jurisdiction_request','bco_40_5_matter','review_and_control','other'];
    const labels = {complaint:'Complaint',appeal:'Appeal',judicial_reference:'Judicial reference',original_jurisdiction_request:'Original-jurisdiction request',bco_40_5_matter:'BCO 40-5 matter',review_and_control:'Review and control',other:'Other'};
    const state = {items:[], filtered:[], active:null, detail:null, editing:false, priorityCounts:{}, statisticalAudit:{}};
    const offline = window.__SYNOPSIS_REVIEW_OFFLINE__ || null;
    const offlineStorageKey = offline ? `pca-synopsis-review:${offline.registry_sha256}` : null;
    let offlineChanges = offline ? JSON.parse(localStorage.getItem(offlineStorageKey) || '{}') : {};
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const friendly = value => labels[value] || String(value || '—').replaceAll('_',' ');
    function toast(message){ $('toast').textContent=message; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),1400); }
    function reviewer(){ const value=$('reviewer').value.trim(); if(!value){ toast('Enter a reviewer name or initials first'); $('reviewer').focus(); return null; } return value; }
    function effectiveOfflineDecision(id){ return Object.hasOwn(offlineChanges,id) ? offlineChanges[id] : offline.baseline_decisions[id]; }
    function offlineCounts(items){ const counts={approved:0,rejected:0,corrected:0,source_repair:0,unreviewed:0,total:items.length}; items.forEach(x=>counts[x.decision]++); return counts; }
    async function json(url, options){
      if(!offline){ const response=await fetch(url, options); const body=await response.json(); if(!response.ok) throw new Error(body.error||response.statusText); return body; }
      const parsed=new URL(url,'https://offline.invalid');
      if(options?.method==='POST'&&parsed.pathname==='/api/decision'){
        const id=parsed.searchParams.get('id'), payload=JSON.parse(options.body||'{}'), detail=offline.cases[id];
        if(!detail) throw new Error('Case not found');
        if(payload.decision==='unreviewed') offlineChanges[id]={decision:'unreviewed'};
        else {
          const record={case_id:id,decision:payload.decision,reviewer:payload.reviewer,notes:payload.notes||'',updated_at:new Date().toISOString(),publication_authorized:false,acceptability_pass:payload.acceptability_pass ?? payload.decision==='approved'};
          if(payload.decision==='corrected') record.corrected={summary:payload.summary,matter_type:payload.matter_type,final_dispositions:payload.final_dispositions};
          offlineChanges[id]=record;
        }
        localStorage.setItem(offlineStorageKey,JSON.stringify(offlineChanges));
        const index=await json('/api/index'); return {decision:effectiveOfflineDecision(id),counts:index.counts};
      }
      if(parsed.pathname==='/api/index'){
        const result=structuredClone(offline.index);
        result.items.forEach(item=>{ const d=effectiveOfflineDecision(item.case_id); item.decision=d?.decision||'unreviewed'; item.reviewer=d?.reviewer; item.updated_at=d?.updated_at; });
        result.counts=offlineCounts(result.items); return result;
      }
      if(parsed.pathname==='/api/case'){
        const id=parsed.searchParams.get('id'), result=structuredClone(offline.cases[id]);
        if(!result) throw new Error('Case not found'); result.decision=effectiveOfflineDecision(id)||null; return result;
      }
      throw new Error('Unsupported offline operation');
    }
    function exportOffline(){
      const payload={schema_version:1,registry_sha256:offline.registry_sha256,exported_at:new Date().toISOString(),publication_authorized:false,cases:offlineChanges};
      const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}), link=document.createElement('a');
      link.href=URL.createObjectURL(blob); link.download='synopsis-review-decisions.json'; link.click(); URL.revokeObjectURL(link.href);
    }
    async function loadIndex(keep=true){ const data=await json('/api/index'); const order={must_review:0,high_priority:1,statistical_sample:2,remaining:3}; state.items=data.items.sort((a,b)=>(order[a.audit_group]??9)-(order[b.audit_group]??9)||b.impact_score-a.impact_score||b.risk_score-a.risk_score||a.case_id.localeCompare(b.case_id)); state.priorityCounts=data.priority_counts||{}; state.statisticalAudit=data.statistical_audit||{}; renderProgress(data.counts); applyFilters(); if(!keep || !state.active || !state.filtered.some(x=>x.case_id===state.active)) await selectCase(state.filtered[0]?.case_id); }
    function renderProgress(c){ const reviewed=c.total-c.unreviewed, queue=state.priorityCounts.recommended_queue, sample=state.statisticalAudit; const sampleText=sample.planned_sample?` · random sample ${sample.reviewed_sample}/${sample.planned_sample}`:''; $('progressBar').style.width=`${reviewed/c.total*100}%`; $('progressText').textContent=`${reviewed} of ${c.total} reviewed · ${queue||0} recommended${sampleText} · ${c.approved} approved · ${c.corrected} corrected · ${c.rejected} rejected · ${c.source_repair} source repair`; }
    function applyFilters(){ const q=$('search').value.trim().toLowerCase(), status=$('statusFilter').value, provider=$('providerFilter').value, priority=$('priorityFilter').value;
      state.filtered=state.items.filter(x=>(!q||`${x.case_id} ${x.title} ${x.identity_remapped_from||''}`.toLowerCase().includes(q))&&(status==='all'||x.decision===status)&&(provider==='all'||x.provider===provider)&&(priority==='all'||(priority==='queue'&&(x.selected_for_audit||x.decision!=='unreviewed'))||(priority==='reviewed'&&x.decision!=='unreviewed')||x.audit_group===priority)); renderList(); }
    function renderList(){ $('caseList').innerHTML=state.filtered.length?state.filtered.map(x=>`<button class="case-item ${escapeHtml(x.decision)} ${x.case_id===state.active?'active':''}" data-id="${escapeHtml(x.case_id)}"><span class="id">${escapeHtml(x.case_id)}</span><span class="title">${escapeHtml(x.title)}</span><span class="priority">${escapeHtml(friendly(x.audit_group))} · risk ${escapeHtml(x.risk_score)}</span></button>`).join(''):'<div class="empty">No cases match.</div>'; document.querySelectorAll('.case-item').forEach(x=>x.onclick=()=>selectCase(x.dataset.id)); }
    async function selectCase(id){ if(!id)return; state.active=id; state.editing=false; $('editor').classList.add('hidden'); renderList(); state.detail=await json('/api/case?id='+encodeURIComponent(id)); renderCase(); document.querySelector('.review').scrollTop=0; $('sourceText').scrollTop=0; }
    function renderCase(){ const d=state.detail, c=d.candidate, row=d.catalog, sel=d.selection, decision=d.decision;
      $('caseId').textContent=[d.case_id,row.era_label].filter(Boolean).join(' · '); $('caseTitle').textContent=row.title||c.title||'Untitled case'; $('sourcePath').textContent=d.source.path||'Source unavailable'; $('sourceText').textContent=d.source.text||'No local case source was found.';
      const decisionState=decision?.decision||'unreviewed';
      const priority=d.priority||{}, modelLabel=sel.model==='gpt-6-astra'?'Astra':sel.model==='gpt-5.6-sol'?'Sol':sel.provider==='deepseek'?'DeepSeek':sel.model||sel.provider;
      const informational=[modelLabel, friendly(c.matter_type||row.matter_type), ...(c.final_dispositions||row.final_dispositions||[]).map(friendly), priority.audit_group?`${friendly(priority.audit_group)} · risk ${priority.risk_score}`:null].filter(Boolean);
      const identityNote=sel.identity_remapped_from?`<span class="chip identity">Previously indexed as ${escapeHtml(sel.identity_remapped_from)}</span>`:'';
      $('chips').innerHTML=informational.map(x=>`<span class="chip">${escapeHtml(x)}</span>`).join('')+identityNote+`<span class="chip status ${escapeHtml(decisionState)}">${escapeHtml(friendly(decisionState))}</span>`;
      document.querySelectorAll('.actions button').forEach(button=>button.classList.remove('selected'));
      const decisionButton={approved:'approve',corrected:'correct',rejected:'reject',source_repair:'repair',unreviewed:'undo'}[decisionState];
      if(decisionButton) $(decisionButton).classList.add('selected');
      $('currentSummary').textContent=row.summary||'No existing synopsis.'; $('candidateSummary').textContent=c.summary||'No candidate synopsis.';
      const currentDisp=(row.final_dispositions||[]).map(friendly).join('; '), candDisp=(c.final_dispositions||row.final_dispositions||[]).map(friendly).join('; ');
      $('metadata').innerHTML=`<div><dt>Existing matter type</dt><dd>${escapeHtml(friendly(row.matter_type))}</dd></div><div><dt>Candidate matter type</dt><dd>${escapeHtml(friendly(c.matter_type||row.matter_type))}</dd></div><div><dt>Existing disposition</dt><dd>${escapeHtml(currentDisp)}</dd></div><div><dt>Candidate disposition</dt><dd>${escapeHtml(candDisp)}</dd></div><div><dt>Review basis</dt><dd>${escapeHtml(row.standard_of_review_detail||friendly(row.standard_of_review))}</dd></div><div><dt>Provider file</dt><dd>${escapeHtml(sel.path)}</dd></div>`;
      const notes=c.evidence_notes||{}, priorityReasons=(priority.reasons||[]).join('; '), adjudication=priority.issue_adjudication;
      const adjudicationHtml=adjudication?`<p><strong>Issue adjudication (${escapeHtml(friendly(adjudication.status))}):</strong> ${escapeHtml(adjudication.finding)} <span class="muted">${escapeHtml(adjudication.evidence||'')}</span></p>`:'';
      $('evidence').innerHTML=adjudicationHtml+(priorityReasons?`<p><strong>Why this priority:</strong> ${escapeHtml(priorityReasons)}</p>`:'')+Object.entries(notes).map(([k,v])=>`<p><strong>${escapeHtml(friendly(k))}:</strong> ${escapeHtml(v)}</p>`).join('')+`<p><strong>Source limits:</strong> ${escapeHtml(c.source_limits||'Not supplied in this candidate schema.')}</p>`;
      $('notes').value=decision?.notes||''; $('editSummary').value=decision?.corrected?.summary||c.summary||''; $('editMatter').value=decision?.corrected?.matter_type||c.matter_type||row.matter_type; $('editDispositions').value=(decision?.corrected?.final_dispositions||c.final_dispositions||row.final_dispositions||[]).join(', ');
    }
    async function decide(decision, extra={}){ const name=decision==='unreviewed'?($('reviewer').value.trim()||''):reviewer(); if(decision!=='unreviewed'&&!name)return;
      if(decision==='source_repair'&&!$('notes').value.trim()){ toast('Add a brief source-repair note first'); $('notes').focus(); return; }
      try { await json('/api/decision?id='+encodeURIComponent(state.active),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,reviewer:name,notes:$('notes').value,...extra})}); toast(friendly(decision)); await loadIndex(true); await selectCase(state.active); if(decision!=='unreviewed') setTimeout(()=>move(1,true),250); } catch(e){toast(e.message);} }
    function move(delta, unreviewedFirst=false){ let list=state.filtered; if(unreviewedFirst){ const pending=state.items.filter(x=>x.decision==='unreviewed'); if(pending.length){ selectCase(pending.find(x=>x.case_id>state.active)?.case_id||pending[0].case_id); return; }} const i=Math.max(0,list.findIndex(x=>x.case_id===state.active)); selectCase(list[(i+delta+list.length)%list.length]?.case_id); }
    function edit(){ state.editing=true; $('editor').classList.remove('hidden'); $('editSummary').focus(); }
    function saveCorrection(){ const dispositions=$('editDispositions').value.split(',').map(x=>x.trim()).filter(Boolean); decide('corrected',{summary:$('editSummary').value,matter_type:$('editMatter').value,final_dispositions:dispositions}); }
    matterTypes.forEach(x=>$('editMatter').add(new Option(friendly(x),x)));
    $('reviewer').value=localStorage.getItem('pca-reviewer')||''; $('reviewer').onchange=()=>localStorage.setItem('pca-reviewer',$('reviewer').value.trim());
    if(offline){ $('exportOffline').classList.remove('hidden'); $('exportOffline').onclick=exportOffline; document.title+=' — Offline'; }
    $('search').oninput=applyFilters; $('statusFilter').onchange=applyFilters; $('providerFilter').onchange=applyFilters; $('priorityFilter').onchange=applyFilters;
    $('approve').onclick=()=>decide('approved'); $('reject').onclick=()=>decide('rejected'); $('repair').onclick=()=>decide('source_repair'); $('undo').onclick=()=>decide('unreviewed'); $('correct').onclick=edit; $('saveCorrection').onclick=saveCorrection; $('previous').onclick=()=>move(-1); $('next').onclick=()=>move(1);
    document.addEventListener('keydown',e=>{ const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName); if(state.editing&&e.ctrlKey&&e.key==='Enter'){e.preventDefault();saveCorrection();return;} if(typing)return; const key=e.key.toLowerCase(); const actions={a:()=>decide('approved'),r:()=>decide('rejected'),x:()=>decide('source_repair'),u:()=>decide('unreviewed'),c:edit,j:()=>move(1),k:()=>move(-1)}; if(actions[key]){e.preventDefault();actions[key]();} });
    loadIndex(false).catch(e=>toast(e.message));
  </script>
</body>
</html>
