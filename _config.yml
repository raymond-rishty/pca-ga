# keep the rendered site to the readable corpus (data files stay in the repo, just not the site).
# NB: Jekyll matches exclude globs against the *basename* too, so a bare "*.json" would also drop
# the root catalogue search's data file — so we exclude the data JSON by its location instead.
exclude:
  - .claude/
  - .github/
  - scripts/
  - "*.jsonl"
  - index/*.json
  - index/rpr/
  - index/segments/
  - index/hunt/
  - index/sjc_official/
  - index/digest/
  - index/structure/
  - Gemfile
  - Gemfile.lock
  - vendor/
