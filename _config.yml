title: "PCA General Assembly Minutes (1973–2025)"
description: "Searchable, OCR-corrected corpus of all 52 volumes of the PCA Minutes of the General Assembly, with overture and judicial-case catalogues."
theme: jekyll-theme-cayman
url: "https://raymond-rishty.github.io"
baseurl: "/pca-ga"

markdown: CommonMarkGhPages
commonmark:
  options:
    - SMART
    - FOOTNOTES
    # The corpus intentionally uses raw HTML anchors and page metadata comments.
    - UNSAFE
  extensions:
    - strikethrough
    - autolink
    - table
    - tagfilter

# the minutes are plain text, not Liquid templates — don't let stray braces break the build
defaults:
  - scope:
      path: "inquiries"
    values:
      layout: inquiry
      render_with_liquid: false
  - scope:
      path: ""
    values:
      layout: default
      render_with_liquid: false

  # Restore the canonical PCA Historical Center PDF provenance stripped by the re-OCR replacement.
  - scope:
      path: "markdown/ga01_1973.md"
    values:
      source_pdf:
        file: "1st_pcaga_1973.pdf"
