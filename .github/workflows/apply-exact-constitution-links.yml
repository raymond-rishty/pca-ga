name: Apply exact Constitution link targets

on:
  push:
    branches: [agent/exact-constitution-links]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exact-constitution-links
      - name: Patch exact section targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          linker = Path('scripts/44_link_constitution_refs.py')
          source = linker.read_text(encoding='utf-8')
          old = '                href = f"{READER_BASE}#bco/{chapter}"\n'
          new = '                href = f"{READER_BASE}#bco/{canonical}"\n'
          if source.count(old) != 1:
              raise SystemExit('Unexpected linker href implementation')
          source = source.replace(old, new, 1)

          test_old = "    assert 'data-bco-ref=\"8-4\"' in rendered\n"
          test_new = test_old + "    assert f'{READER_BASE}#bco/5-9' in rendered\n"
          if source.count(test_old) != 1:
              raise SystemExit('Unexpected linker self-test block')
          source = source.replace(test_old, test_new, 1)
          linker.write_text(source, encoding='utf-8')

          ui = Path('assets/constitution-links.js')
          js = ui.read_text(encoding='utf-8')
          replacements = [
              ('Open chapter in Constitution', 'Open in Constitution'),
              ('reader.href = `https://raymond-rishty.github.io/pca-constitution-reader/#bco/${encodeURIComponent(chapter)}`;',
               'reader.href = `https://raymond-rishty.github.io/pca-constitution-reader/#bco/${encodeURIComponent(ref)}`;'),
          ]
          for old_js, new_js in replacements:
              if js.count(old_js) != 1:
                  raise SystemExit(f'Unexpected UI match count for {old_js!r}')
              js = js.replace(old_js, new_js, 1)
          ui.write_text(js, encoding='utf-8')

          sw = Path('sw.js')
          sw_source = sw.read_text(encoding='utf-8')
          if "const CACHE = 'pca-ga-v8';" not in sw_source:
              raise SystemExit('Unexpected PCA-GA cache version')
          sw.write_text(sw_source.replace("const CACHE = 'pca-ga-v8';", "const CACHE = 'pca-ga-v9';", 1), encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          python3 -m py_compile scripts/44_link_constitution_refs.py
          node --check assets/constitution-links.js
          grep -Fq 'href = f"{READER_BASE}#bco/{canonical}"' scripts/44_link_constitution_refs.py
          grep -Fq 'Open in Constitution' assets/constitution-links.js
          grep -Fq 'encodeURIComponent(ref)' assets/constitution-links.js
          grep -Fq "const CACHE = 'pca-ga-v9';" sw.js
      - name: Commit focused change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-exact-constitution-links.yml
          git add scripts/44_link_constitution_refs.py assets/constitution-links.js sw.js
          git commit -m "Link BCO citations to exact sections"
          git push origin HEAD:agent/exact-constitution-links
