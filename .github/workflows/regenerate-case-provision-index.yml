name: Regenerate case provision index

on:
  push:
    branches:
      - agent/remove-case-provision-audit-paragraph

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Regenerate index
        run: python3 scripts/44_case_provision_index.py .
      - name: Commit generated output
        run: |
          if git diff --quiet -- index/CASES-BY-PROVISION.md index/case_provision_index.json; then
            echo "Generated output is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/CASES-BY-PROVISION.md index/case_provision_index.json
          git commit -m "Regenerate case provision index"
          git push
