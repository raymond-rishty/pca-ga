name: Build and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out PCA Constitution source
        uses: actions/checkout@v4
        with:
          repository: raymond-rishty/pca-constitution-reader
          path: _constitution
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Record build tool versions
        id: tool-versions
        shell: bash
        run: |
          echo "python=$(python --version)" >> "$GITHUB_OUTPUT"
          echo "ruby=$(ruby --version)" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
      - name: Detect overture-source changes
        id: overture-source
        shell: bash
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE"
          # Overture artifacts are curated and checked in. General Minutes edits must not run the
          # legacy heading-based extractor, which cannot reconstruct the full current corpus.
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(scripts/21_overture_titles\.py$|scripts/37_overture_pages\.py$|index/overture_body_ends\.json$|index/overture_bodies\.jsonl$|index/overture_titles\.jsonl$|index/overture_dispositions\.jsonl$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and validate repository data with Gradle
        shell: bash
        env:
          OVERTURE_CHANGED: ${{ steps.overture-source.outputs.changed }}
          PYTHON_VERSION: ${{ steps.tool-versions.outputs.python }}
        run: |
          args=(--build-cache prepareData -PconstitutionDir=_constitution -PsiteDir=_site -PpythonCommand=python -PpythonVersion="$PYTHON_VERSION")
          if [[ "$OVERTURE_CHANGED" == "true" ]]; then
            args+=(-PregenerateOvertures)
          fi
          bash gradlew "${args[@]}"
      - name: Check in generated judicial case catalogue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- index/JUDICIAL-CASES.html; then
            echo "Judicial catalogue is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/JUDICIAL-CASES.html
          git commit -m "Regenerate judicial case catalogue [skip ci]"
          git push origin HEAD:main
      - name: Restore cached rendered pages and incremental state
        uses: actions/cache@v4
        with:
          path: |
            _site
            .jekyll-cache
            .jekyll-metadata
            .gradle/build-state
          key: pca-render-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            pca-render-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml') }}-${{ github.ref_name }}-
            pca-render-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml') }}-main-
            pca-render-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml') }}-
      - name: Incrementally render and validate the site with Gradle
        env:
          PYTHON_VERSION: ${{ steps.tool-versions.outputs.python }}
          RUBY_VERSION: ${{ steps.tool-versions.outputs.ruby }}
          NODE_VERSION: ${{ steps.tool-versions.outputs.node }}
        run: >-
          bash gradlew --build-cache siteCached
          -PconstitutionDir=_constitution
          -PsiteDir=_site
          -PpythonCommand=python
          -PpythonVersion="$PYTHON_VERSION"
          -PrubyVersion="$RUBY_VERSION"
          -PnodeVersion="$NODE_VERSION"
          -PrefreshPreviewSearch=true
      - name: Install browser regression dependencies
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Run browser result-navigation regressions
        shell: bash
        run: |
          set -euo pipefail
          ln -s _site pca-ga
          python -m http.server 4173 --directory . >/tmp/pca-ga-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          PCA_TEST_BASE_URL=http://127.0.0.1:4173/pca-ga node tests/result-navigation.browser.test.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
