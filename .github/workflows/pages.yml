name: Build and deploy Pages
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out PCA Constitution source
        uses: actions/checkout@v4
        with:
          repository: raymond-rishty/pca-constitution-reader
          path: _constitution
          persist-credentials: false
      - name: Validate study catalogue
        run: python3 scripts/check_study_catalogue.py .
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: jekyll-${{ runner.os }}-${{ hashFiles('Gemfile', '_config.yml') }}
          restore-keys: jekyll-${{ runner.os }}-
      - name: Build
        run: bundle exec jekyll build
      - name: Link constitutional references
        run: python3 scripts/44_link_constitution_refs.py _site _constitution/content/bco.js
      - name: Validate constitutional reference output
        run: |
          test -s _site/assets/constitution/bco-index.json
          grep -R -q 'data-bco-ref=' _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
