name: Build and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out PCA Constitution source
        uses: actions/checkout@v4
        with:
          repository: raymond-rishty/pca-constitution-reader
          path: _constitution
          persist-credentials: false
      - name: Detect overture-source changes
        id: overture-source
        shell: bash
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE"
          # Overture artifacts are curated and checked in. General Minutes edits must not run the
          # legacy heading-based extractor, which cannot reconstruct the full current corpus.
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Eq '^(scripts/21_overture_titles\.py$|scripts/37_overture_pages\.py$|index/overture_body_ends\.json$|index/overture_bodies\.jsonl$|index/overture_titles\.jsonl$|index/overture_dispositions\.jsonl$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate overture pages from Minutes source
        if: steps.overture-source.outputs.changed == 'true'
        run: |
          python3 scripts/21_overture_titles.py extract .
          python3 scripts/37_overture_pages.py .
      - name: Reconcile judicial case artifacts
        run: python3 scripts/27_case_index_reconcile.py
      - name: Synchronize case-page cards from judicial metadata
        run: python3 scripts/84_sync_case_page_metadata.py .
      - name: Regenerate judicial case catalogue
        run: python3 scripts/13_judicial_taxonomy_index.py .
      - name: Regenerate auditable judicial provision evidence
        run: python3 scripts/44_case_provision_index.py .
      - name: Build the shared provision catalogue
        run: python3 scripts/build_provision_catalogue.py . _constitution/content
      - name: Project authority index from provision catalogue
        run: python3 scripts/43_authority_index.py .
      - name: Check in generated judicial case catalogue
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- index/JUDICIAL-CASES.html; then
            echo "Judicial catalogue is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index/JUDICIAL-CASES.html
          git commit -m "Regenerate judicial case catalogue [skip ci]"
          git push origin HEAD:main
      - name: Rebuild catalogue search index
        run: python3 scripts/35_search_index.py .
      - name: Generate BCO provision manifests
        run: python3 scripts/45_bco_manifests.py . --out api/bco
      - name: Regenerate LLM distribution
        run: python3 scripts/34_llm_pack.py .
      - name: Validate study catalogue
        run: python3 scripts/check_study_catalogue.py .
      - name: Restore minutes source PDF provenance
        run: |
          python3 scripts/ensure_minutes_source_pdf_metadata.py
          python3 scripts/ensure_minutes_source_pdf_metadata.py --check
      - name: Test source PDF metadata normalizer
        run: python3 tests/test_minutes_source_pdf_metadata.py
      - name: Rebuild and validate extracted source registry
        run: |
          # Overture regeneration above can update the authoritative body index.
          # Refresh the derived registry before validating and rendering links.
          python3 scripts/build_source_registry.py . --write
          python3 scripts/build_source_registry.py . --check
      - name: Test extracted source PDF metadata
        run: python3 tests/test_extracted_source_pdf_metadata.py
      - name: Test source registry
        run: python3 tests/test_source_registry.py
      - name: Test provision research generator
        run: python3 tests/test_provision_research.py
      - name: Test provision catalogue projections
        run: python3 tests/test_provision_catalogue.py
      - name: Test focused Node regressions
        run: node --test tests/source-pdf-links.test.js tests/minutes-back-to-top.test.js tests/minutes-page-source-pdf.test.js tests/search-engine.test.js tests/search-record.test.js tests/search-index-overtures.test.js tests/pagefind-search.test.js tests/result-navigation.test.js
      - name: Add source PDF metadata to extracted documents
        run: python3 scripts/add_extracted_source_pdf_metadata.py .
      - name: Validate footnote pairing
        run: python3 scripts/81_validate_footnote_integrity.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: jekyll-${{ runner.os }}-${{ hashFiles('Gemfile', 'Gemfile.lock', '_config.yml') }}
          restore-keys: jekyll-${{ runner.os }}-
      - name: Build
        run: bundle exec jekyll build
      - name: Install browser regression dependencies
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Run browser result-navigation regressions
        shell: bash
        run: |
          set -euo pipefail
          ln -s _site pca-ga
          python3 -m http.server 4173 --directory . >/tmp/pca-ga-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          PCA_TEST_BASE_URL=http://127.0.0.1:4173/pca-ga node tests/result-navigation.browser.test.js
      - name: Validate BCO provision manifests
        shell: bash
        run: |
          test -s _site/api/bco/index.json
          test -s _site/api/bco/38-1.json
          test -s _site/api/provisions/index.json
          test -s _site/api/provisions/bco/38-1.json
          grep -Eq '"schema_version"[[:space:]]*:[[:space:]]*2' _site/api/bco/38-1.json
          cmp -s _site/api/bco/38-1.json _site/api/provisions/bco/38-1.json
          grep -q '/api/provisions/index.json' _site/llms.txt
      - name: Validate rendered extracted source PDF links
        shell: bash
        run: |
          shopt -s nullglob
          extracted=(_site/cases/*.html _site/inquiries/*.html _site/overtures/*.html _site/rpr/exc/*.html _site/studies/*.html)
          found=0
          for page in "${extracted[@]}"; do
            if grep -q 'class="source-pdf-link"' "$page"; then
              found=$((found + 1))
            fi
          done
          if [[ $found -lt 1 ]]; then
            echo "No rendered extracted page exposes a source PDF link" >&2
            exit 1
          fi
          if ! grep -R -q '51st_pcaga_2024.pdf#page=749' _site/cases; then
            echo "Expected GA51 case source PDF page link was not rendered" >&2
            exit 1
          fi
          if grep -R -Eq 'class="source-pdf-link" href=""' _site/cases _site/inquiries _site/overtures _site/rpr _site/studies; then
            echo "An extracted source PDF link has an empty href" >&2
            exit 1
          fi
          for directory in cases inquiries overtures rpr/exc studies; do
            if ! grep -R -q 'data-source-pdf-actions' "_site/$directory"; then
              echo "No source-PDF page action rendered for $directory" >&2
              exit 1
            fi
          done
          if ! grep -R -q 'data-source-id="case-pdf:' _site/cases; then
            echo "No dedicated judicial source PDF was rendered" >&2
            exit 1
          fi
          if ! grep -R -q 'data-source-id="study-pdf:' _site/studies; then
            echo "No dedicated study source PDF was rendered" >&2
            exit 1
          fi
      - name: Validate rendered source PDF links
        shell: bash
        run: |
          shopt -s nullglob
          pages=(_site/markdown/ga??_????.html)
          if [[ ${#pages[@]} -ne 52 ]]; then
            echo "Expected 52 rendered minutes volumes, found ${#pages[@]}" >&2
            exit 1
          fi
          for page in "${pages[@]}"; do
            if ! grep -Eq 'class="source-pdf-link" href="https://www\.pcahistory\.org/pca/ga/[0-9]+(st|nd|rd|th)_pcaga_[0-9]{4}\.pdf"' "$page"; then
              echo "Missing canonical source PDF link in $page" >&2
              exit 1
            fi
          done
      - name: Install BSB importer dependency
        run: python3 -m pip install --disable-pip-version-check openpyxl
      - name: Link constitutional references
        run: |
          python3 scripts/build_bsb_assets.py --check
          python3 scripts/44_normalize_bco_prefixes.py _site
          python3 scripts/44_link_constitution_refs.py \
            _site \
            _constitution/content/bco.js \
            _constitution/content/wcf.js \
            _constitution/content/wlc.js \
            _constitution/content/wsc.js \
            _constitution/content/rao.js
      - name: Generate canonical provision research pages
        run: |
          python3 scripts/46_provision_research.py site . _site --baseurl /pca-ga
          test -s _site/provisions/index.html
          test -s _site/provisions/bco/40-1/index.html
          test -s _site/provisions/wlc/q-62/index.html
          test -s _site/provisions/rao/1-1/index.html
          test -s _site/app/provision_search.json
      - name: Validate constitutional reference output
        run: |
          test -s _site/assets/constitution/bco-index.json
          test -s _site/assets/constitution/standards/wcf.json
          test -s _site/assets/constitution/standards/wlc.json
          test -s _site/assets/constitution/standards/wsc.json
          test -s _site/assets/constitution/packs/rao.json
          test -s _site/assets/minutes-pages.json
          test -s _site/assets/scripture-audit.json
          test -s _site/assets/scripture-audit-summary.json
          test -s _site/assets/scripture/bsb/John/3.json
          grep -R -q 'data-bco-ref=' _site
          grep -R -q 'class="constitution-ref"' _site
          grep -R -q 'data-constitution-book="rao"' _site
          grep -R -q 'class="minutes-ref"' _site
          grep -R -q 'class="scripture-ref"' _site
      - name: Build full-text passage index
        run: npx --yes pagefind@1.5.2 --site _site
      - name: Validate full-text passage index
        shell: bash
        run: |
          grep -R -q 'data-pagefind-body' _site/markdown
          grep -R -q 'content="General Assembly minutes"' _site/markdown
          test -s _site/pagefind/pagefind.js
          test "$(find _site/pagefind -type f | wc -l)" -gt 5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
