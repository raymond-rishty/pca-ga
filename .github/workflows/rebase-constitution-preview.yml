name: Rebase Constitution preview formatting

on:
  push:
    branches:
      - agent/preserve-constitution-preview-formatting
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-constitution-preview-formatting
          fetch-depth: 0
      - name: Apply resolved changes onto current main
        run: |
          python3 .github/rebase_constitution_preview.py
          python3 -m py_compile scripts/44_link_constitution_refs.py
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('linker', 'scripts/44_link_constitution_refs.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.self_test()
          PY
          grep -Fq '.constitution-sheet__body .lead{' assets/constitution-links.css
          grep -Fq "const CACHE = 'pca-ga-v11';" sw.js
      - name: Commit resolved rebase
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/rebase-constitution-preview.yml .github/rebase_constitution_preview.py
          git add assets/constitution-links.css scripts/44_link_constitution_refs.py sw.js
          git commit -m "Rebase structured BCO previews onto main"
          git push origin HEAD:agent/preserve-constitution-preview-formatting
