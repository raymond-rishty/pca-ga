name: Apply structured Constitution previews

on:
  push:
    branches: [agent/preserve-constitution-preview-formatting]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-constitution-preview-formatting
      - name: Preserve BCO block formatting
        run: |
          python3 .github/apply_constitution_preview_formatting.py
          python3 -m py_compile scripts/44_link_constitution_refs.py
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('linker', 'scripts/44_link_constitution_refs.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          mod.self_test()
          PY
          grep -Fq 'body = render_section_body(section)' scripts/44_link_constitution_refs.py
          grep -Fq '.constitution-sheet__body .lead{' assets/constitution-links.css
          grep -Fq "const CACHE = 'pca-ga-v10';" sw.js
      - name: Commit focused change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-constitution-preview-formatting.yml .github/apply_constitution_preview_formatting.py
          git add scripts/44_link_constitution_refs.py assets/constitution-links.css sw.js
          git commit -m "Preserve BCO formatting in previews"
          git push origin HEAD:agent/preserve-constitution-preview-formatting
