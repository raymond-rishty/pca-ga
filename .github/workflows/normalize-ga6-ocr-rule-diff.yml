name: Normalize GA6 OCR rule diff

on:
  push:
    branches:
      - agent/fix-ga6-book-ocr

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore source formatting and add only the correction
        shell: bash
        run: |
          git fetch origin main
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path("scripts/domain_terms.json")
          base = subprocess.check_output(
              ["git", "show", "origin/main:scripts/domain_terms.json"],
              text=True,
          )
          needle = '"Wamor": "Warrior"\n}'
          replacement = '"Wamor": "Warrior",\n"B()()k": "Book"\n}'
          assert base.count(needle) == 1
          corrected = base.replace(needle, replacement)
          path.write_text(corrected)
          assert json.loads(corrected)["corrections"]["B()()k"] == "Book"
          PY

      - name: Remove temporary workflow and commit result
        shell: bash
        run: |
          rm .github/workflows/normalize-ga6-ocr-rule-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/domain_terms.json .github/workflows/normalize-ga6-ocr-rule-diff.yml
          git diff --cached --check
          git commit -m "Narrow GA6 OCR correction diff"
          git push origin HEAD:${{ github.ref_name }}
