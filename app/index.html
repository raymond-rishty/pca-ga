<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=../">
  <link rel="canonical" href="https://raymond-rishty.github.io/pca-ga/">
  <title>Catalogue search moved · PCA General Assembly Minutes</title>
  <script>
    (() => {
      const target = new URL('../', window.location.href);
      const query = new URLSearchParams(window.location.search).get('q');
      if (query) target.searchParams.set('q', query);
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>The catalogue search has moved to <a href="../">the PCA General Assembly Minutes home page</a>.</p>
</body>
</html>
